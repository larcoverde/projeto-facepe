<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página não encontrada — LactApp</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="alternate icon" href="assets/favicon.ico">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="assets/site.webmanifest">

    <script src="js/cookies.js"></script>
    <script>
        (function () {
            var preferencia = lerCookie("lactapp-tema") || "claro";
            var escuro = preferencia === "escuro" ||
                (preferencia === "sistema" && window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches);
            if (escuro) {
                document.documentElement.setAttribute("data-theme", "escuro");
            }
        })();
    </script>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/paginas-estaticas.css">
</head>
<body>

<button class="botao-tema botao-tema-flutuante" id="botaoTema" type="button" aria-label="Ativar tema escuro">🌙</button>

<div class="pagina-404">
    <div class="pagina-404-box">
        <div class="pagina-404-emoji">🥛</div>
        <div class="pagina-404-codigo">404</div>
        <div class="pagina-404-titulo">Página não encontrada</div>
        <p class="pagina-404-texto">
            O endereço que você tentou acessar não existe ou foi movido.
            Verifique o link ou volte para a página inicial do LactApp.
        </p>
        <a class="pagina-404-botao" href="/">Voltar para o início</a>
    </div>
</div>

<script src="js/tema.js"></script>
<script src="js/consentimento.js"></script>

</body>
</html>
